[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labmcp"
version = "0.1.0"
description = "Shared plumbing for the nix-labs MCP servers (docs/MCP-RULES.md)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["labmcp"]
